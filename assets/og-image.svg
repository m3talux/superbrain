<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- Background gradient: Obsidian deep purple → Claude warm orange -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1530"/>
      <stop offset="50%" stop-color="#2d1f4a"/>
      <stop offset="100%" stop-color="#3d1f3f"/>
    </linearGradient>
    <linearGradient id="brain-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle radial glow behind brain -->
  <circle cx="960" cy="320" r="320" fill="url(#glow)"/>

  <!-- Decorative subtle grid (faint) -->
  <g stroke="rgba(167,139,250,0.05)" stroke-width="1" fill="none">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
  </g>

  <!-- LEFT SIDE: text content (inside 1080-wide safe zone, 100px left margin) -->

  <!-- Small tag/label above wordmark -->
  <g transform="translate(100, 130)">
    <rect width="190" height="32" rx="16" fill="rgba(249,115,22,0.15)" stroke="rgba(249,115,22,0.4)" stroke-width="1"/>
    <text x="95" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif" font-size="14" font-weight="600" fill="#fb923c" letter-spacing="1.2">CLAUDE CODE PLUGIN</text>
  </g>

  <!-- Wordmark: SuperBrain -->
  <text x="100" y="245" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-2">SuperBrain</text>

  <!-- Tagline line 1 -->
  <text x="100" y="320" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif" font-size="34" font-weight="500" fill="#e9d5ff">Session memory for Claude Code.</text>

  <!-- Tagline line 2 (slightly muted) -->
  <text x="100" y="365" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif" font-size="34" font-weight="500" fill="#a78bfa">A second brain that builds itself.</text>

  <!-- Install command in monospace, in a subtle pill -->
  <g transform="translate(100, 430)" filter="url(#cardshadow)">
    <rect width="620" height="64" rx="12" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="24" y="42" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" font-weight="500" fill="#86efac">$</text>
    <text x="48" y="42" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" font-weight="500" fill="#f5f5f5">/plugin install superbrain</text>
  </g>

  <!-- Bottom-left: badges row (license, github, platforms) -->
  <g transform="translate(100, 540)">
    <!-- MIT -->
    <rect width="60" height="26" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="30" y="18" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">MIT</text>
    <!-- macOS + Linux -->
    <rect x="72" width="130" height="26" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="137" y="18" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#e9d5ff">macOS · Linux</text>
    <!-- Node -->
    <rect x="214" width="110" height="26" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="269" y="18" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#e9d5ff">Node ≥ 20</text>
    <!-- Domain -->
    <text x="1080" y="18" text-anchor="end" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.5)">github.com/m3talux/superbrain</text>
  </g>

  <!-- RIGHT SIDE: brain glyph + flying note cards -->

  <!-- Brain glyph (Phosphor Icons duotone, MIT-licensed) -->
  <g transform="translate(1105, 360)">
    <g transform="translate(-156, -156) scale(1.22)" fill="url(#brain-grad)">
      <!-- Duotone back layer: faded outer cerebrum shape -->
      <path opacity="0.25" d="M240 124a48 48 0 0 1-32 45.27V176a40 40 0 0 1-80 0a40 40 0 0 1-80 0v-6.73a48 48 0 0 1 0-90.54V72a40 40 0 0 1 80 0a40 40 0 0 1 80 0v6.73A48 48 0 0 1 240 124"/>
      <!-- Foreground: bilateral structure with gyri folds + central fissure -->
      <path d="M248 124a56.11 56.11 0 0 0-32-50.61V72a48 48 0 0 0-88-26.49A48 48 0 0 0 40 72v1.39a56 56 0 0 0 0 101.2V176a48 48 0 0 0 88 26.49A48 48 0 0 0 216 176v-1.41A56.09 56.09 0 0 0 248 124M88 208a32 32 0 0 1-31.81-28.56A56 56 0 0 0 64 180h8a8 8 0 0 0 0-16h-8a40 40 0 0 1-13.33-77.73A8 8 0 0 0 56 78.73V72a32 32 0 0 1 64 0v68.26A47.8 47.8 0 0 0 88 128a8 8 0 0 0 0 16a32 32 0 0 1 0 64m104-44h-8a8 8 0 0 0 0 16h8a56 56 0 0 0 7.81-.56A32 32 0 1 1 168 144a8 8 0 0 0 0-16a47.8 47.8 0 0 0-32 12.26V72a32 32 0 0 1 64 0v6.73a8 8 0 0 0 5.33 7.54A40 40 0 0 1 192 164m16-52a8 8 0 0 1-8 8h-4a36 36 0 0 1-36-36v-4a8 8 0 0 1 16 0v4a20 20 0 0 0 20 20h4a8 8 0 0 1 8 8m-148 8h-4a8 8 0 0 1 0-16h4a20 20 0 0 0 20-20v-4a8 8 0 0 1 16 0v4a36 36 0 0 1-36 36"/>
    </g>
  </g>

  <!-- Three note cards radiating from the brain -->

  <!-- Card 1: top-right, "Decisions" -->
  <g transform="translate(1080, 130) rotate(8)" filter="url(#cardshadow)">
    <rect width="140" height="60" rx="6" fill="url(#card-grad)" stroke="rgba(167,139,250,0.5)" stroke-width="1"/>
    <text x="14" y="22" font-family="ui-monospace, monospace" font-size="10" fill="#a78bfa" letter-spacing="0.5">decisions/</text>
    <text x="14" y="42" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">2026-06-02</text>
    <text x="14" y="54" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)">Why session memory</text>
  </g>

  <!-- Card 2: middle-right, "Captures" -->
  <g transform="translate(1110, 270) rotate(-5)" filter="url(#cardshadow)">
    <rect width="140" height="60" rx="6" fill="url(#card-grad)" stroke="rgba(196,132,252,0.5)" stroke-width="1"/>
    <text x="14" y="22" font-family="ui-monospace, monospace" font-size="10" fill="#c084fc" letter-spacing="0.5">captures/</text>
    <text x="14" y="42" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Auth flow</text>
    <text x="14" y="54" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)">JWT vs session...</text>
  </g>

  <!-- Card 3: bottom-right, "Daily" -->
  <g transform="translate(1080, 410) rotate(6)" filter="url(#cardshadow)">
    <rect width="140" height="60" rx="6" fill="url(#card-grad)" stroke="rgba(249,115,22,0.5)" stroke-width="1"/>
    <text x="14" y="22" font-family="ui-monospace, monospace" font-size="10" fill="#fb923c" letter-spacing="0.5">daily/</text>
    <text x="14" y="42" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">2026-06-02.md</text>
    <text x="14" y="54" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)">3 sessions, 12 links</text>
  </g>

  <!-- Subtle connector lines from brain to cards (dotted) -->
  <g stroke="rgba(167,139,250,0.25)" stroke-width="1.5" stroke-dasharray="3,4" fill="none">
    <path d="M 1060 280 Q 1100 200 1150 160"/>
    <path d="M 1080 320 Q 1130 320 1180 305"/>
    <path d="M 1060 360 Q 1100 410 1150 440"/>
  </g>
</svg>
